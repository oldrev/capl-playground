<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAPL Playground · Vector CAPL → WebAssembly</title>
    <meta
      name="description"
      content="An online playground for Vector CAPL: a modular compiler (lexer → parser → AST → sema → pluggable backends) that emits real WebAssembly and C, with a simulated CANoe measurement."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      const wasmPath = ["%BASE_URL%", "capl/capl_wasm.js"].join("");
      window.__CAPL_WASM_READY__ = (async () => {
        const { default: init } = await import(/* @vite-ignore */ wasmPath);
        await init();
      })();
    </script>
    <script type="module" src="%BASE_URL%src/main.tsx"></script>
  </body>
</html>
