[workspace]
resolver = "2"
members = [
    "crates/capl-diag",
    "crates/capl-ast",
    "crates/capl-parse",
    "crates/capl-sema",
    "crates/capl-codegen-wasm",
    "crates/capl-codegen-c",
    "crates/capl-driver",
    "crates/capl-wasm",
    "crates/capl-model",
    "crates/capl-trace-core",
    "crates/capl-trace-asc",
    "crates/capl-database-core",
    "crates/capl-database-dbc",
    "crates/capl-project",
    "crates/capl-runtime",
    "crates/capl-desktop",
    "crates/capl-replay",
    "crates/capl-sysvars",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/capl-playground"
description = "A modular compiler for Vector CAPL"

[workspace.dependencies]
capl-diag = { path = "crates/capl-diag", version = "0.4.0" }
capl-ast = { path = "crates/capl-ast", version = "0.4.0" }
capl-parse = { path = "crates/capl-parse", version = "0.4.0" }
capl-sema = { path = "crates/capl-sema", version = "0.4.0" }
capl-codegen-wasm = { path = "crates/capl-codegen-wasm", version = "0.4.0" }
capl-codegen-c = { path = "crates/capl-codegen-c", version = "0.4.0" }
capl-driver = { path = "crates/capl-driver", version = "0.4.0" }
capl-model = { path = "crates/capl-model", version = "0.4.0" }
capl-trace-core = { path = "crates/capl-trace-core", version = "0.4.0" }
capl-database-core = { path = "crates/capl-database-core", version = "0.4.0" }
capl-project = { path = "crates/capl-project", version = "0.4.0" }
capl-runtime = { path = "crates/capl-runtime", version = "0.4.0" }
capl-sysvars = { path = "crates/capl-sysvars", version = "0.4.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Storage", "Window"] }
wasmi = "0.31"
wasm-encoder = "0.261"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.metadata.coverage]
tool = "cargo-llvm-cov"
command = "cargo llvm-cov --workspace --all-features --lcov --output-path coverage/lcov.info"
html = "cargo llvm-cov --workspace --all-features --html --open"
